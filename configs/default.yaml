project:
  name: jaywalking-risk-recognition
  seed: 42

paths:
  raw_data_dir: data/raw
  video_dir: data/videos
  annotation_dir: data/annotations
  processed_dir: data/processed
  feature_dir: data/features
  pose_model_dir: models/pose
  yolo_model_dir: models/yolo
  segmentation_model_dir: models/segmentation
  classifier_model_dir: models/classifiers
  log_dir: outputs/logs
  figure_dir: outputs/figures
  result_dir: outputs/results
  report_dir: outputs/reports
  input_video: data/videos/sample.mp4
  feature_csv: data/features/features.csv
  jaad_feature_csv: data/features/jaad_features.csv
  dummy_feature_csv: data/features/dummy_features.csv

jaad:
  annotation_root: data/raw/JAAD_annotations
  video_dir: data/raw/JAAD/JAAD_clips
  feature_csv: data/features/jaad_features.csv
  sample_type: beh
  split_subset: all_videos
  limit_videos: null
  pose_backend: yolo

video:
  frame_stride: 5
  max_frames: null

detection:
  enabled: true
  model_name: yolov8n.pt
  confidence_threshold: 0.35
  person_class_id: 0

pose:
  backend: yolo
  model_path: models/yolo/yolov8n-pose.pt
  confidence_threshold: 0.25
  inference_mode: bbox

segmentation:
  # Supported backends: dummy, deeplabv3, segformer, yolo_seg
  backend: dummy
  model_name: nvidia/segformer-b2-finetuned-cityscapes-1024-1024
  model_path: null
  device: auto
  num_classes: 19
  road_class_ids:
    - 0
  sidewalk_class_ids:
    - 1
  road_class_names:
    - road
    - street
  sidewalk_class_names:
    - sidewalk
    - pavement
  # Backward-compatible single-class settings. Prefer *_class_ids above.
  road_class_id: 0
  sidewalk_class_id: 1
  threshold: 0.5

features:
  label_default: 0
  road_distance_scale: 1.0

training:
  split_strategy: official
  target_column: label
  test_size: 0.2
  random_state: 42
  sequence_length: 8
  batch_size: 16
  epochs: 3
  learning_rate: 0.001
  lstm_hidden_size: 64
  lstm_num_layers: 1

experiments:
  feature_sets:
    bbox_only:
      - center_x
      - center_y
    road_relation_only:
      - distance_to_road
      - foot_on_road
      - center_on_road
      - approach_rate
    pose_only:
      - center_x
      - center_y
      - left_ankle_x
      - left_ankle_y
      - right_ankle_x
      - right_ankle_y
      - body_direction
      - step_direction
    pose_road_relation:
      - center_x
      - center_y
      - left_ankle_x
      - left_ankle_y
      - right_ankle_x
      - right_ankle_y
      - body_direction
      - step_direction
      - distance_to_road
      - foot_on_road
      - center_on_road
      - approach_rate
    pose_road_signal:
      - center_x
      - center_y
      - left_ankle_x
      - left_ankle_y
      - right_ankle_x
      - right_ankle_y
      - body_direction
      - step_direction
      - distance_to_road
      - foot_on_road
      - center_on_road
      - approach_rate
      - traffic_light_present
      - traffic_light_state_code
